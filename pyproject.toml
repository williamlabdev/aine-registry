[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aine-registry"
dynamic = ["version"]
description = "Read-only multi-root portfolio intelligence for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AINE contributors" }]
dependencies = []

[project.scripts]
aine-registry = "registry.aine_registry:main"

[tool.setuptools.packages.find]
include = ["registry*"]

[tool.setuptools.dynamic]
version = {attr = "registry.version.VERSION"}

[tool.setuptools.package-data]
registry = ["schema/*.json"]
